# SPDX-License-Identifier: GPL-3.0-or-later
# HIRAKU's release packages (PLAN.md section 28): a Linux .tar.xz and a Windows .zip that run the
# DJ Main, System 573 and Twinkle games from the user's own dropped-in data, with nothing else to
# install. Built with HK_GAME_BINARIES off: nothing in them comes from a game (a clean checkout has
# no build/ or dumps/ anyway).
#
# - a push of a tag v*: both packages, published as a GitHub release (a draft, to look over first),
#   with the LGPL libraries' sources beside them;
# - a push to main or to a branch named ci/... (or a pull request): both packages as the run's
#   artifacts, kept 14 days, and the unit tests (ctest; the Windows programs' under Wine; on
#   Linux again under ASan and UBSan): what fails on one system only shows before a release is
#   tagged, and a ci/... branch shows it before main has the change;
# - by hand (Actions > release > Run workflow): both packages as the run's artifacts.
name: release

on:
  push:
    branches: [main, "ci/**"]   # ci/...: to try a change with these compilers before main has it
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# a newer push to the same branch replaces a run still going; a tag's run is never cut short
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# every job reads the repo and no more (they run what they download: compilers, libraries); the
# one that makes the draft release, which runs none of that, may write
permissions:
  contents: read

jobs:
  linux:
    # 22.04: the package runs on glibc 2.35 and later
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: sudo tools/release-setup-ubuntu.sh python
      - name: Cache the libraries
        uses: actions/cache@v6
        with:
          path: ~/hiraku-deps
          key: linux-deps-${{ hashFiles('tools/release-deps-linux.sh', 'tools/ffmpeg-min.sh') }}
      - name: Libraries (SDL3, zstd, FFmpeg, Qt, Python, 7-Zip)
        run: tools/release-deps-linux.sh ~/hiraku-deps
      - name: Cache PCSX2 Reliquary's libraries
        uses: actions/cache@v6
        with:
          path: ~/hiraku-python/deps
          key: python-deps-${{ hashFiles('tools/release-python-linux.sh') }}
      - name: The Konami Python core (PCSX2 Reliquary 1.9.4, hiraku-python)
        run: tools/release-python-linux.sh ~/hiraku-python ~/hiraku-deps
      - name: Build and package
        run: HK_PYTHON_WORK=~/hiraku-python tools/release.sh linux dist ~/hiraku-deps
        env:   # the release's number in the package (VERSION), for the updater; none for a run by hand
          HK_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          HK_TESTS: ${{ startsWith(github.ref, 'refs/tags/v') && 'OFF' || 'ON' }}
      - name: Unit tests
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        # tools/ingest.py's tests with the package's Python (3.14; the runner's is 3.10, and ingest needs tomllib)
        run: |
          cmake build/release-linux -DPython3_EXECUTABLE=$HOME/hiraku-deps/python/bin/python3
          ctest --test-dir build/release-linux --output-on-failure
      - name: The LGPL libraries' sources
        run: cp ~/hiraku-deps/src/ffmpeg-*.tar.xz ~/hiraku-deps/src/SDL3-*.tar.gz dist/
      - uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}
          name: hiraku-linux
          path: dist/*
      # Last, so that the package is there whatever this finds: everything built again with
      # AddressSanitizer and UndefinedBehaviorSanitizer, and the unit tests run under them
      # (tools/sanitize.sh). clang's run-time library for them is a package of its own.
      - name: Unit tests under ASan and UBSan
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          sudo apt-get install -y -q --no-install-recommends "libclang-rt-$(clang -dumpversion | cut -d. -f1)-dev"
          tools/sanitize.sh build/sanitize ~/hiraku-deps

  python-windows:
    # The Konami Python core for Windows (PLAN.md section 26, phase 4): hiraku-python.exe built inside
    # PCSX2 Reliquary's source with clang-cl, as PCSX2 builds for Windows; the windows job packages it
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          path: hiraku
      # Reliquary 1.9.4's source from HIRAKU's own release, HIRAKU's patch applied; its dependency
      # script less what HIRAKU doesn't use: Qt and KDDockWidgets (PCSX2's interface is off) and SDL
      # (PCSX2's has no video: SDL's own package below)
      - name: Reliquary's source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o rel.zip https://github.com/Roganis/HIRAKU/releases/download/reliquary-1.9.4/pcsx2-reliquary-1.9.4-reliquary.zip
          echo "da9b9a601e8b3eeede9eb8bae6d46e81e1001beb98b438859aa847c75b547884  rel.zip" | sha256sum -c -
          7z x -y rel.zip > /dev/null
          mv pcsx2-reliquary-* reliquary
          cd reliquary
          patch -p1 < ../hiraku/oracle/pcsx2/reliquary-oracle.patch
          rmdir pcsx2/GS/parallel-gs 2>/dev/null || true
          s=.github/workflows/scripts/windows/build-dependencies.bat
          # each block runs from its `echo` line to the next; CRLF, as cmd wants for its labels
          awk '/^echo / { skip = /Qt|KDDockWidgets|SDL/ } !skip' "$s" | sed 's/\r*$/\r/' > "${s%.bat}-hiraku.bat"
          curl -fL --retry 3 -o ../sdl.zip https://github.com/libsdl-org/SDL/releases/download/release-3.4.18/SDL3-devel-3.4.18-VC.zip
          echo "$(awk '$2 == "SDL3-devel-3.4.18-VC.zip" { print $1 }' ../hiraku/tools/release-sums.txt)  ../sdl.zip" | sha256sum -c -
          (cd .. && 7z x -y sdl.zip > /dev/null)
      # restored and saved apart: saved as soon as they're built, whatever the rest of the run does
      - name: Cache PCSX2 Reliquary's libraries
        id: deps
        uses: actions/cache/restore@v6
        with:
          path: reliquary/deps
          key: reliquary-1.9.4 windows deps ${{ hashFiles('reliquary/.github/workflows/scripts/windows/build-dependencies-hiraku.bat', 'reliquary/.github/workflows/scripts/common/*.patch') }}
      - name: PCSX2 Reliquary's libraries
        if: steps.deps.outputs.cache-hit != 'true'
        shell: cmd
        env:
          DEBUG: 0
        run: reliquary\.github\workflows\scripts\windows\build-dependencies-hiraku.bat
      - name: Keep the libraries
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: reliquary/deps
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - name: Build hiraku-python
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`call vswhere -latest -property installationPath`) do set "VSINSTPATH=%%i"
          call "%VSINSTPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b
          cmake -S reliquary -B reliquary\build -G Ninja -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl ^
            "-DCMAKE_PREFIX_PATH=%cd%\reliquary\deps;%cd%\SDL3-3.4.18" ^
            -DENABLE_QT_UI=OFF -DENABLE_TESTS=OFF -DUSE_LINKED_FFMPEG=OFF -DDISABLE_ADVANCE_SIMD=ON ^
            "-DHIRAKU_DIR=%cd%\hiraku" -DHK_RELEASE=ON || exit /b
          cmake --build reliquary\build --target hiraku-python || exit /b
          rem the Visual C++ runtime it links (MSVCP140, VCRUNTIME140, VCRUNTIME140_1), the version its
          rem headers are: not part of Windows itself, and an older one in System32 crashes it (v0.3.0,
          rem built with 14.51, in MSVCP140.dll 14.29 as spice2x's installs it: from 14.40 on, the
          rem STL's std::mutex needs a runtime as new). Wine has its own, so a run under Wine can't tell
          for /d %%d in ("%VCToolsRedistDir%x64\Microsoft.VC14*.CRT") do set "CRT=%%d"
          if not defined CRT exit /b 1
          mkdir crt
          for %%f in (msvcp140.dll vcruntime140.dll vcruntime140_1.dll) do copy /y "%CRT%\%%f" crt\ || exit /b
      # what the package takes: hiraku-python.exe, the DLLs it loads, PCSX2's resources\
      - name: Assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p python-win
          cp reliquary/build/hiraku-python/hiraku-python.exe python-win/
          cp reliquary/deps/bin/*.dll python-win/
          cp SDL3-3.4.18/lib/x64/SDL3.dll python-win/
          cp crt/*.dll python-win/
          cp -r reliquary/bin/resources python-win/resources
      - uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}
          name: hiraku-python-windows
          path: python-win

  windows:
    needs: python-windows
    # Cross-built on Linux (PLAN.md section 26), in Arch: its mingw-w64 and clang are what the
    # Windows port was made with, and its Qt's moc, rcc and uic build the launcher against the
    # static Windows qtbase of the same version
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 240
    steps:
      - name: Build tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git clang lld llvm mingw-w64-gcc qt6-base cmake ninja \
            nasm python p7zip zip curl
      # (before the build is set up: tests/CMakeLists.txt gives the tests to Wine if it finds it)
      - name: Wine, to run the unit tests
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: pacman -S --noconfirm --needed wine
      - uses: actions/checkout@v7
      - name: Qt's version
        id: qt
        run: echo "version=$(qmake6 -query QT_VERSION)" >> "$GITHUB_OUTPUT"
      - name: Cache the libraries
        uses: actions/cache@v6
        with:
          path: out/win-deps
          key: windows-deps-qt${{ steps.qt.outputs.version }}-${{ hashFiles('tools/release-deps-windows.sh', 'tools/win-deps.sh', 'tools/ffmpeg-min.sh', 'cmake/x86_64-w64-mingw32.cmake') }}
      - name: Libraries (SDL3, zlib, zstd, static Qt, Python, FFmpeg, 7-Zip)
        run: HK_QT_BUILD=$RUNNER_TEMP/qt tools/release-deps-windows.sh
      - uses: actions/download-artifact@v8
        with:
          name: hiraku-python-windows
          path: python-win
      - name: Build and package
        run: HK_PYTHON_WIN=$PWD/python-win tools/release.sh windows dist
        env:   # the release's number in the package (VERSION), for the updater; none for a run by hand
          HK_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          HK_TESTS: ${{ startsWith(github.ref, 'refs/tags/v') && 'OFF' || 'ON' }}
      # The Windows programs' own tests, run under Wine: what only the Windows build does (its waits,
      # its paths, the swap chain's thread against a pretend Direct3D, the pop'n board's go-between)
      # is otherwise never run before a release. No display: the one test that draws is skipped.
      - name: Unit tests (the Windows programs, under Wine)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: ctest --test-dir build/release-windows --output-on-failure --timeout 300
        env:   # (Wine's folder where the job's user owns the folder above it: not the runner's temporary one)
          WINEPREFIX: /tmp/hiraku-wine
          WINEDEBUG: -all
      - uses: actions/upload-artifact@v7
        with:
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 90 || 14 }}
          name: hiraku-windows
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # the two packages and the sources beside them (not the Python core's folder, which is in the zip)
      - uses: actions/download-artifact@v8
        with:
          name: hiraku-linux
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: hiraku-windows
          path: dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the notes are the release's own news, written when it's published
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "HIRAKU $GITHUB_REF_NAME" --notes ""
