# beatmania III (GQ972 JA-B), Konami 2000
id = "bm3"
title = "beatmania III"
family = "bm3"          # bm3 | popn | ppp | kbm  - selects the board variant
mame = "bm3"            # MAME set name, used by the oracle
boot_seconds = 41       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[program]
exe = "HIKARU.EXE"
sha1 = "fcea7282ecfd7ed83a987b11356dc5851098ac9b"   # unpacked image, not the packed exe
size = 0x100000
load = 0x80000000
entry = 0x80003000

[board]
dongle = "gq972"   # DS1991 image inside the MAME ROM set

[spu]
rom = "972spua01.3q"     # 68000 program, from the MAME set
