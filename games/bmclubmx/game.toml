# beatmania Club MIX (ver JA-A), Konami 2000: generated from MAME's djmain.cpp
id = "bmclubmx"
title = "beatmania Club MIX"
family = "djbm"         # DJ Main beatmania cabinet: 5 keys + turntable per player, effect
mame = "bmclubmx"       # MAME set name, used by the oracle
core = "djmain"         # interpreted 68EC020 on the DJ Main board (runtime/djmain/)
boot_seconds = 77       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[roms]
program = ["993jaa01.6a", "993jaa02.8a"]
sprites = ["993jaa03.19a", "993jaa04.20a", "993jaa05.22a", "993jaa06.24a"]
tiles   = ["993jaa07.22d", "993jaa08.23d", "993jaa09.25d", "993jaa10.27d"]

[hdd]
chd = "993hdda01"
chs = "526,255,63"       # its geometry (cylinders, heads, sectors), as the CHD gives it to MAME's drive
# ATA security, from MAME init_bmclubmx(): the disk stays locked until the game sends these
ata_master_password = "4d4743284b294e4f4d4120494c41204c49524847535452205345524545562e44"
ata_user_password = "442030573c3f38324f38744c07616c64767d70161f6f0c0f0a1a71071e197d02"
