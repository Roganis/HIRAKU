# beatmania CORE REMIX (ver JA-A), Konami 2000: generated from MAME's djmain.cpp
id = "bmcorerm"
title = "beatmania CORE REMIX"
family = "djbm"         # DJ Main beatmania cabinet: 5 keys + turntable per player, effect
mame = "bmcorerm"       # MAME set name, used by the oracle
core = "djmain"         # interpreted 68EC020 on the DJ Main board (runtime/djmain/)
boot_seconds = 77       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[roms]
program = ["a05jaa01.6a", "a05jaa02.8a"]
sprites = ["a05jaa03.19a", "a05jaa04.20a", "a05jaa05.22a", "a05jaa06.24a"]
tiles   = ["a05jaa07.22d", "a05jaa08.23d", "a05jaa09.25d", "a05jaa10.27d"]

[hdd]
chd = "a05jaa11"
chs = "8944,15,63"       # its geometry (cylinders, heads, sectors), as the CHD gives it to MAME's drive
# ATA security, from MAME init_bmcorerm(): the disk stays locked until the game sends these
ata_master_password = "4d4743284b294e4f4d4120494c41204c49524847535452205345524545562e44"
ata_user_password = "4442564b3f4d4a275a520c3e6a04636f7264727f1f7317040509140d7a747d7a"
