# beatmania IIDX 3rd style (GC992 VER. JAB), Konami 2000
id = "bmiidx3b"
title = "beatmania IIDX 3rd style (JAB)"
family = "iidx"         # IIDX cabinet: 7 keys and a turntable per player, VEFX, Effect, 5 effector sliders
mame = "bmiidx3b"        # MAME set name, used by the oracle
core = "twinkle"        # Twinkle (runtime/twinkle/, PLAN.md section 21); no core yet (TW-1)
boot_seconds = 39       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)
first_boot = "the device check passes, then E150 (backup RAM cleared): press 1P Start to clear it."

[roms]
bios = "863a03.7b"      # Twinkle BIOS (27C040), the same chip in every set
spu = "863a05.2x"       # the SPU board's 68000 program (27C4096), the same in every set
dongle = "992a02"       # the security dongle's M24C02 EEPROM

[board]
dongle = "m24c02"       # MAME twinklei: I2C EEPROM (2nd style and later)
dvd_port = "uart"       # the DVD player on the super I/O's second 16550 (Substream and later)

[cd]
chd = "gc992-jab01"     # the program CD, on the SCSI bus
video_chd = "gc992-jaa04" # the Video CD in the external player (background videos)

[hdd]
chd = "992hdda01"       # the SPU board's hard disk: keysounds and music
