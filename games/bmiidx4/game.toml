# beatmania IIDX 4th style (GCA03 VER. JAA), Konami 2000
id = "bmiidx4"
title = "beatmania IIDX 4th style"
family = "iidx"         # IIDX cabinet: 7 keys and a turntable per player, VEFX, Effect, 5 effector sliders
mame = "bmiidx4"        # MAME set name, used by the oracle
core = "twinkle"        # Twinkle (runtime/twinkle/, PLAN.md section 21)
boot_seconds = 41       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[roms]
bios = "863a03.7b"      # Twinkle BIOS (27C040), the same chip in every set
spu = "863a05.2x"       # the SPU board's 68000 program (27C4096), the same in every set
dongle = "a03"          # the security dongle's M24C02 EEPROM

[board]
dongle = "m24c02"       # MAME twinklei: I2C EEPROM (2nd style and later)
dvd_port = "uart"       # the DVD player on the super I/O's second 16550 (Substream and later)

[cd]
chd = "a03jaa01"        # the program CD, on the SCSI bus
video_chd = "a03jaa02"  # the Video CD in the external player (background videos)

[hdd]
chd = "a03jaa03"        # the SPU board's hard disk: keysounds and music
