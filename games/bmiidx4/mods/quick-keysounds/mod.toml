name = "Quick keysounds"
version = "0.1"
game = "bmiidx4"
description = "The keysound of a key or turntable the player presses goes to the sound board in the frame the press is read, about 1 ms after it, instead of with the next frame's sounds (18 ms after it). Not how the machine behaved: the keysound comes one frame sooner. The music, the other sounds and the judging keep their timing. For the program of GCA03 VER. JAA."

# The game's sounds (4th style, GCA03 VER. JAA): a sound is a request in a queue of 16 (0x80182590: a
# count, then the requests). Once a frame the main loop calls the sound service (0x8002d1c0): if the
# sound board is free (dual-port RAM 0x1f000400 bit 7 clear) and the queue holds requests, it writes them
# all to the dual-port RAM and rings the board's mailbox; with none, it sends one of the board's other
# commands (a second queue). So the board gets one command a frame at most. Later in the frame the play
# screen's frame (0x8002b04c, called at 0x800232a0) runs the chart (its sound events: the music's start)
# and then the keys and turntables, whose keysounds it queues: they waited for the next frame's service.
#
# The mod's routines lie in main RAM the machine leaves at zero and never touches (0x8000d000, in
# the BIOS's area below the program; checked over boot, attract, play, test mode and its reset):
# - the play screen's frame is called through the first; the second, called where the keys' part
#   begins (0x8002b274), notes the queue's count there in the first's frame on the stack. When it
#   was 0, the queue holds requests after the play screen's frame (the presses' keysounds only) and
#   the board had no command yet this frame, the first calls the game's own sound service at once,
#   which sends them if the board is free (if not, they wait for the next frame's, as before), and
#   sets a flag (0x801825b8, in a gap after the queue that the game doesn't use) once they're sent;
# - the service's "board free" test (0x8002d1dc) also reads the flag: with it set, the service
#   ends there and clears it, as the game's sent those keysounds then, so the board's other
#   commands keep their frames. It takes as many instructions as the game's, so the dual-port RAM
#   is written at the same moments;
# - after the mailbox rings (0x8002c830), the main loop's frame number (0x800538a8) is noted at
#   0x801825bc, for the first's "no command yet this frame" (a second command within a frame, while
#   the board still works on the first, can lose its keysound).
# Requests made elsewhere (the chart's, the other screens') are sent when they always were.

[[patch]]                      # the routines (zeros before): 0x8000d000 (around the play screen's frame),
address = 0x8000d000           # 0x8000d078 (the keys' part begins), 0x8000d08c (after the ring)
original = ""
replace = ""

[[patch]]                      # the play screen's frame called through the first
address = 0x800232a0           # (jal 0x8002b04c -> jal 0x8000d000)
original = "13ac000c"
replace = "0034000c"

[[patch]]                      # the keys' part begins through the second
address = 0x8002b274           # (jal 0x8001f8d0 -> jal 0x8000d078)
original = "347e000c"
replace = "1e34000c"

[[patch]]                      # the service's "board free" test reads the flag too (7 words: nop; sb/lbu v0 via its
address = 0x8002d1dc           # stack; nop; andi; bnez end; delay slot -> lui t0; lhu t1, flag; andi; bnez end; delay slot; bnez t1, end; sh zero, flag)
original = "000000001000a2a31000a29300000000800042307100401400000000"
replace = "1880083cb825099580004230730040140000000071002015b82500a5"

[[patch]]                      # after the mailbox rings: jr ra -> j 0x8000d08c
address = 0x8002c830           # (its frame noted)
original = "0800e00300000000"
replace = "2334000800000000"
