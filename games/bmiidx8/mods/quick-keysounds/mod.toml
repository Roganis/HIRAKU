name = "Quick keysounds"
version = "0.1"
game = "bmiidx8"
description = "The keysound of a key or turntable the player presses goes to the sound board in the frame the press is read, about 1 ms after it, instead of with the next frame's sounds (18 ms after it). Not how the machine behaved: the keysound comes one frame sooner. The music, the other sounds and the judging keep their timing. For the program of GCC44 VER. JAA."

# The game's sounds (8th style, GCC44 JAA): a sound is a request in a queue of 16 (0x8018d068: a
# count, then the requests), put there by 0x8003c4cc. Once a frame the main loop (0x80019ae4) calls
# the sound service (0x8003cce0): if the sound board is free (dual-port RAM 0x1f000400 bit 7 clear)
# and the queue holds requests, it writes them all to the dual-port RAM (0x8003c5d4) and rings the
# board's mailbox (0x8003c2f4); with none, it sends one of the board's other commands (a second
# queue). So the board gets one command a frame at most. Later in the frame the play screen's frame
# (0x8003a9e0, called at 0x8002ae50) runs the chart (its sound events: the music's start) and then
# the keys and turntables, whose keysounds it queues (0x800390f4): they waited for the next frame's
# service.
#
# The mod's routines lie in main RAM the machine leaves at zero and never touches (0x8000d000, in
# the BIOS's area below the program; checked over boot, attract, play, test mode and its reset):
# - the play screen's frame is called through the first; the second, called where the keys' part
#   begins (0x8003ac2c), notes the queue's count there in the first's frame on the stack. When it
#   was 0, the queue holds requests after the play screen's frame (the presses' keysounds only) and
#   the board had no command yet this frame, the first calls the game's own sound service at once,
#   which sends them if the board is free (if not, they wait for the next frame's, as before), and
#   sets a flag (0x8018d090, in a gap after the queue that the game doesn't use) once they're sent;
# - the service's "board free" test (0x8003ccfc) also reads the flag: with it set, the service
#   ends there and clears it, as the game's sent those keysounds then, so the board's other
#   commands keep their frames. It takes as many instructions as the game's, so the dual-port RAM
#   is written at the same moments;
# - after the mailbox rings (0x8003c304), the main loop's frame number (0x8008687c) is noted at
#   0x8018d094, for the first's "no command yet this frame" (a second command within a frame, while
#   the board still works on the first, can lose its keysound).
# Requests made elsewhere (the chart's, the other screens') are sent when they always were.

[[patch]]                      # the routines (zeros before): 0x8000d000 (around the play screen's frame),
address = 0x8000d000           # 0x8000d078 (the keys' part begins), 0x8000d08c (after the ring)
original = ""
replace = ""

[[patch]]                      # the play screen's frame called through the first
address = 0x8002ae50           # (jal 0x8003a9e0 -> jal 0x8000d000)
original = "78ea000c"
replace = "0034000c"

[[patch]]                      # the keys' part begins through the second
address = 0x8003ac2c           # (jal 0x800263c0 -> jal 0x8000d078)
original = "f098000c"
replace = "1e34000c"

[[patch]]                      # the service's "board free" test reads the flag too (0x8003ccfc..0x8003cd14:
address = 0x8003ccfc           # nop; sb/lbu v0 via its stack; nop; andi; bnez end; nop -> lui t0, 0x8019;
original = "000000001000a2a31000a29300000000800042307700401400000000"   # lhu t1, flag; andi; bnez end;
replace = "1980083c90d009958000423079004014000000007700201590d000a5"   # nop; bnez t1, end; sh zero, flag

[[patch]]                      # after the mailbox rings: jr ra -> j 0x8000d08c (its frame noted)
address = 0x8003c304
original = "0800e00300000000"
replace = "2334000800000000"
