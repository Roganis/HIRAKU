name = "Quick keysounds"
version = "0.1"
game = "bmiidxc"
description = "The keysound of a key or turntable the player presses goes to the sound board in the frame the press is read, about 1 ms after it, instead of with the next frame's sounds (18 ms after it). Not how the machine behaved: the keysound comes one frame sooner. The music, the other sounds and the judging keep their timing. For the program of 896 VER. JAB."

# The game's sounds (the club kit's IIDX cabinet, 896 JAB): a sound is a request in a queue of
# 16 (0x80165480: a count, then the requests), put there by 0x8003d030. Once a frame the main loop
# (0x80026230) calls the sound service (0x8003c7b4): if the sound board is free (dual-port RAM
# 0x1f000400 bit 7 clear) and the queue holds requests, it writes them all to the dual-port RAM and
# rings the board's mailbox (0x8003c430); with none, it sends one of the board's other commands
# (a second queue). So the board gets one command a frame at most. Later in the frame the play
# screen's frame (0x8003a7fc, called at 0x80033c98, 0x800346f0, 0x8003568c) runs the chart (its sound events:
# the music's start) and then the keys and turntables, whose keysounds it queues: they waited for
# the next frame's service.
#
# The mod's routines lie in main RAM the machine leaves at zero and never touches (0x8000d000, in
# the BIOS's area below the program; checked over boot, attract, play, test mode and its reset):
# - the play screen's frame is called through the first (at each of its three calls); the second,
#   called where the keys' part begins (0x8003aab0), notes the queue's count there in the first's
#   frame on the stack. When it was 0, the queue holds requests after the play screen's frame (the
#   presses' keysounds only) and the board had no command yet this frame, the first calls the game's
#   own sound service at once, which sends them if the board is free (if not, they wait for the next
#   frame's, as before), and sets a flag (0x801654a8, in a gap after the queue that the game doesn't
#   use) once they're sent;
# - the service's "board free" test (0x8003c86c) also reads the flag: with it set, the service
#   ends there and clears it, as the game's sent those keysounds then, so the board's other
#   commands keep their frames. It takes as many instructions as the game's, so the dual-port RAM
#   is written at the same moments;
# - after the mailbox rings (0x8003c504), a word in the same gap (0x801654ac) is set to 1; the
#   first clears it when the play screen's frame ends, so it is set there only when this frame's
#   service sent the board a command (the main loop keeps no frame number); a second command within
#   a frame, while the board still works on the first, can lose its keysound.
# Requests made elsewhere (the chart's, the other screens') are sent when they always were.

[[patch]]                      # the routines (zeros before): 0x8000d000 (around the play screen's frame),
address = 0x8000d000           # 0x8000d07c (the keys' part begins), 0x8000d090 (after the ring)
original = ""
replace = ""

[[patch]]                      # the play screen's frame called through the first
address = 0x80033c98           # (jal 0x8003a7fc -> jal 0x8000d000)
original = "ffe9000c"
replace = "0034000c"

[[patch]]                      # the play screen's frame called through the first
address = 0x800346f0           # (jal 0x8003a7fc -> jal 0x8000d000)
original = "ffe9000c"
replace = "0034000c"

[[patch]]                      # the play screen's frame called through the first
address = 0x8003568c           # (jal 0x8003a7fc -> jal 0x8000d000)
original = "ffe9000c"
replace = "0034000c"

[[patch]]                      # the keys' part begins through the second
address = 0x8003aab0           # (jal 0x80035c7c -> jal 0x8000d07c)
original = "1fd7000c"
replace = "1f34000c"

[[patch]]                      # the service's "board free" test reads the flag too (0x8003c86c..0x8003c884:
address = 0x8003c86c           # nop; sb/lbu v0 via its stack; nop; andi; bnez end; lui v0 -> lui t0, 0x8016;
original = "000000001000a2a31000a2930000000080004230da0040141680023c"   # lhu t1, flag; andi; bnez end;
replace = "1680083ca854099580004230dc0040141680023cda002015a85400a5"   # lui v0; bnez t1, end; sh zero, flag

[[patch]]                      # after the mailbox rings: jr ra -> j 0x8000d090 (the ring noted)
address = 0x8003c504
original = "0800e00300000000"
replace = "2434000800000000"
