# beatmania IIDX Substream with DDR 2nd Club Version 2 (GE984 A01 BM), Konami 1999: the IIDX half of the club kit
id = "bmiidxc2"
title = "beatmania IIDX Substream with DDR 2nd Club Version 2"
family = "iidx"         # IIDX cabinet: 7 keys and a turntable per player, VEFX, Effect, 5 effector sliders
mame = "bmiidxc2"       # MAME set name, used by the oracle
core = "twinkle"        # Twinkle (runtime/twinkle/, PLAN.md section 21)
boot_seconds = 47       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)
# The club kit's other program CD (GE984 A01 DDR) is the DDR cabinet's: MAME's ddr2mc2 installs it on
# a System 573. The two cabinets link over serial (docs/CATALOGUE.md, Phase 6); on this board the
# session port is the PS1's SIO1, the player being on the super I/O's UART.

[roms]
bios = "863a03.7b"      # Twinkle BIOS (27C040), the same chip in every set
spu = "863a05.2x"       # the SPU board's 68000 program (27C4096), the same in every set
dongle = "984a02"       # the security dongle's X76F041 (MAME BAD_DUMP, as the 1st style's)

[board]
dongle = "x76f041"      # MAME twinklex2: the 1st style's dongle...
dvd_port = "uart"       # ...and the DVD player on the super I/O's second 16550, as 2nd style on

[cd]
chd = "ge984a01,bm"     # the program CD, on the SCSI bus
video_chd = "gc983a04"  # Substream's Video CD in the external player (background videos)

[hdd]
chd = "983hdda01"       # Substream's hard disk: keysounds and music
