# beatstage complete MIX (ver KA-B), Konami 1999: generated from MAME's djmain.cpp
id = "bscompmx"
title = "beatstage complete MIX (KA-B)"
family = "djbm"         # DJ Main beatmania cabinet: 5 keys + turntable per player, effect
mame = "bscompmx"       # MAME set name, used by the oracle
core = "djmain"         # interpreted 68EC020 on the DJ Main board (runtime/djmain/)
boot_seconds = 77       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)
map = "u"               # MAME djmainu: main_map_u (the IDE ports and tile RAM elsewhere)

[roms]
program = ["858kab01.6a", "858kab02.8a"]
sprites = ["858kab03.19a", "858kab04.20a", "858kab05.22a", "858kab06.24a"]
tiles   = ["858kab07.22d", "858kab08.23d", "858kab09.25d", "858kab10.27d"]

[hdd]
chd = "858kab11"
