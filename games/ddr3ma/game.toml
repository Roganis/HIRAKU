# Dance Dance Revolution 3rd Mix (GN887 VER. AAA), Konami 1999
id = "ddr3ma"
title = "Dance Dance Revolution 3rdMIX (Asia)"
family = "ddr"          # DDR cabinet: 4 panels per player, menu buttons
mame = "ddr3ma"         # MAME set name, used by the oracle
core = "sys573"         # System 573 (runtime/sys573/, PLAN.md section 19); digital I/O board
boot_seconds = 69       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)
install_cassette = "yes"   # the launcher's first boot uses the install cassette (--cassette install)
first_boot = "with the install cassette in, the game installs itself from CD to flash and the PC Card: about 4.5 minutes of game time, no input needed (hold Tab to fast-forward)."
# The cassettes are the same chips as ddr3mk's (MAME merges them), so they go by its file names.

[roms]
bios = "700a01.22g"             # 573 BIOS, the same chip in every set
h8 = "h8a01.bin"                # the H8's start-up response (JVS check)
cassette_eeprom = "gn887kb.u1"  # the game cassette's X76F100
cassette_id = "gn887kb.u6"      # ... and its DS2401 serial number
install_eeprom = "ge887kb.u1"   # the install cassette's X76F100 (first boot: --cassette install)
install_id = "ge887kb.u6"       # ... and its DS2401
digital_id = "digital-id.bin"   # the digital I/O board's DS2401

[board]
io_board = "digital"            # GX894-PWB(B): FPGA + MAS3507D MP3
cassette = "yi"                 # MAME's cassette variant: X76F100 + DS2401
pccard2 = "32mb"                # a Fujitsu 32 MiB flash card in slot 2 (edit data)
memory_card_reader = true       # the JVS memory card reader: the game polls it at frame 187

[cd]
chd = "887aaa02"        # the game CD; installs to the onboard flash on first boot (install cassette)
