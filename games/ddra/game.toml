# Dance Dance Revolution (GN845 VER. AAA), Konami 1999: generated from MAME's ksys573.cpp (tools/gen573.py)
id = "ddra"
title = "Dance Dance Revolution (Asia, AAA)"
family = "ddr"          # DDR cabinet: 4 panels per player, menu buttons
mame = "ddra"           # MAME set name, used by the oracle
core = "sys573"         # System 573 (runtime/sys573/, PLAN.md section 19); analog I/O board
boot_seconds = 85       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[roms]
bios = "700a01.22g"             # 573 BIOS
h8 = "h8a01.bin"                # the H8's start-up response (JVS check)
cassette_eeprom = "gn845aa.u1"  # the game cassette's X76F041

[board]
io_board = "analog"             # GX700-PWB(F): lamp and stage outputs; the music is CD audio
cassette = "x"                  # MAME's cassette variant: X76F041, no DS2401 (cassx)

[cd]
chd = "845aaa02"        # the runtime CD
