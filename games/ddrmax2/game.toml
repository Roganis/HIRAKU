# DDRMAX2 - Dance Dance Revolution 7th Mix (G*B20 VER. JAA), Konami 2002: generated from MAME's ksys573.cpp (tools/gen573.py)
id = "ddrmax2"
title = "DDRMAX2 Dance Dance Revolution 7thMIX"
family = "ddr"          # DDR cabinet: 4 panels per player, menu buttons
mame = "ddrmax2"        # MAME set name, used by the oracle
core = "sys573"         # System 573 (runtime/sys573/, PLAN.md section 19); digital I/O board
boot_seconds = 81       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)
first_boot = "the game installs itself from CD to flash and the PC Card, about 6 minutes of game time, no input needed (hold Tab to fast-forward); at INFO 508, stop it and play again. Then NOTE 605 (RTC-RAM cleared): press F2."   # shown by the launcher

[roms]
bios = "700a01.22g"             # 573 BIOS
h8 = "h8a01.bin"                # the H8's start-up response (JVS check)
cassette_eeprom = "gcb20ja.u1"  # the game cassette's ZS01
cassette_id = "gcb20ja.u6"      # ... and its DS2401 serial number
digital_id = "digital-id.bin"   # the digital I/O board's DS2401

[board]
io_board = "digital"            # GX894-PWB(B): FPGA + MAS3507D MP3
cassette = "zi"                 # MAME's cassette variant: ZS01 + DS2401 (casszi)
pccard2 = "32mb"                # MAME's pccard2_32mb(): a Fujitsu 32 MiB flash card in slot 2
memory_card_reader = true       # the JVS memory card reader

[cd]
chd = "b20jaa02"        # the runtime CD
