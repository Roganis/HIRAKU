# Dance Dance Revolution Solo Bass Mix (GQ894 VER. JAA), Konami 1999: generated from MAME's ksys573.cpp (tools/gen573.py)
id = "ddrsbm"
title = "Dance Dance Revolution Solo Bass Mix"
family = "ddrsolo"      # DDR Solo cabinet: one player, six panels (up-left, up-right too), Select L/R
mame = "ddrsbm"         # MAME set name, used by the oracle
core = "sys573"         # System 573 (runtime/sys573/, PLAN.md section 19); digital I/O board
boot_seconds = 81       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[roms]
bios = "700a01.22g"             # 573 BIOS
h8 = "h8a01.bin"                # the H8's start-up response (JVS check)
cassette_eeprom = "gq894ja.u1"  # the game cassette's X76F100
cassette_id = "gq894ja.u6"      # ... and its DS2401 serial number
digital_id = "digital-id.bin"   # the digital I/O board's DS2401

[board]
io_board = "digital"            # GX894-PWB(B): FPGA + MAS3507D MP3
cassette = "yi"                 # MAME's cassette variant: X76F100 + DS2401 (cassyi)

[cd]
chd = "894jaa02"        # the runtime CD
