# Dance Maniax 2nd Mix (G*A39 VER. JAA), Konami 2000: generated from MAME's ksys573.cpp (tools/gen573.py)
id = "dmx2m"
title = "Dance Maniax 2nd Mix"
family = "dmx"          # Dance Maniax cabinet: per player four hand sensors (up, two down rows; left and right), Select L/R
mame = "dmx2m"          # MAME set name, used by the oracle
core = "sys573"         # System 573 (runtime/sys573/, PLAN.md section 19); digital I/O board
boot_seconds = 57       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[roms]
bios = "700a01.22g"             # 573 BIOS
h8 = "h8a01.bin"                # the H8's start-up response (JVS check)
cassette_eeprom = "gca39ja.u1"  # the game cassette's ZS01
cassette_id = "gca39ja.u6"      # ... and its DS2401 serial number
digital_id = "digital-id.bin"   # the digital I/O board's DS2401

[board]
io_board = "digital"            # GX894-PWB(B): FPGA + MAS3507D MP3
cassette = "zi"                 # MAME's cassette variant: ZS01 + DS2401 (casszi)

[cd]
chd = "a39jaa02"        # the runtime CD
