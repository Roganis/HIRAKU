# Dance Maniax 2nd Mix Append J-Paradise (G*A38 VER. JAA), Konami 2001: generated from MAME's ksys573.cpp (tools/gen573.py)
id = "dmx2majp"
title = "Dance Maniax 2nd Mix Append J-Paradise"
family = "dmx"          # Dance Maniax cabinet: per player four hand sensors (up, two down rows; left and right), Select L/R
mame = "dmx2majp"       # MAME set name, used by the oracle
core = "sys573"         # System 573 (runtime/sys573/, PLAN.md section 19); digital I/O board
boot_seconds = 52       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[roms]
bios = "700a01.22g"             # 573 BIOS
h8 = "h8a01.bin"                # the H8's start-up response (JVS check)
cassette_eeprom = "gca38ja.u1"  # the game cassette's ZS01
cassette_id = "gca38ja.u6"      # ... and its DS2401 serial number
digital_id = "digital-id.bin"   # the digital I/O board's DS2401
preload = ["29f016a.27m:gca38ja.27m", "29f016a.31m:gca38ja.31m"]   # chips the set has filled: device:file (MAME's regions)

[board]
io_board = "digital"            # GX894-PWB(B): FPGA + MAS3507D MP3
cassette = "zi"                 # MAME's cassette variant: ZS01 + DS2401 (casszi)

[cd]
chd = "a38jaa02"        # the runtime CD
