# DrumMania 2nd Mix Session Power Up Kit (GE912 VER. JAB), Konami 1999: generated from MAME's ksys573.cpp (tools/gen573.py)
id = "drmn2mpu"
title = "DrumMania 2nd Mix Session Power Up Kit"
family = "drmn"         # DrumMania cabinet: five pads, the bass pedal, select buttons
mame = "drmn2mpu"       # MAME set name, used by the oracle
core = "sys573"         # System 573 (runtime/sys573/, PLAN.md section 19); digital I/O board
boot_seconds = 99       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)
install_cassette = "yes"   # the launcher's first boot uses the install cassette (--cassette install)

[roms]
bios = "700a01.22g"             # 573 BIOS
h8 = "h8a01.bin"                # the H8's start-up response (JVS check)
cassette_eeprom = "gn912ja.u1"  # the game cassette's ZS01
cassette_id = "gn912ja.u6"      # ... and its DS2401 serial number
install_eeprom = "ge912ja.u1"   # the install cassette's X76F041 (first boot: --cassette install)
install_id = "ge912ja.u6"       # ... and its DS2401
digital_id = "digital-id.bin"   # the digital I/O board's DS2401

[board]
io_board = "digital"            # GX894-PWB(B): FPGA + MAS3507D MP3
cassette = "zi"                 # MAME's cassette variant: ZS01 + DS2401 (casszi)
install_kind = "xi"             # the install cassette's variant: X76F041 + DS2401

[cd]
chd = "912jab02"        # the runtime CD
install_chd = "912za01" # MAME's install disc: the first boot's CD (--cd install)
