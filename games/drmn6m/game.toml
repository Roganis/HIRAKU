# DrumMania 6th Mix (G*B16 VER. JAA), Konami 2001: generated from MAME's ksys573.cpp (tools/gen573.py)
id = "drmn6m"
title = "DrumMania 6th Mix"
family = "drmn"         # DrumMania cabinet: five pads, the bass pedal, select buttons
mame = "drmn6m"         # MAME set name, used by the oracle
core = "sys573"         # System 573 (runtime/sys573/, PLAN.md section 19); digital I/O board
boot_seconds = 149      # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)
first_boot = "the game installs itself from CD to flash, about 2 minutes of game time, no input needed; at INFO 508, stop it and play again. Then NOTE 605 (RTC-RAM cleared): press F2. The multi-session unit boots from its own CD meanwhile."   # shown by the launcher

[roms]
bios = "700a01.22g"             # 573 BIOS
h8 = "h8a01.bin"                # the H8's start-up response (JVS check)
cassette_eeprom = "gcb16jaa.u1" # the game cassette's ZS01
cassette_id = "gcb16jaa.u6"     # ... and its DS2401 serial number
digital_id = "digital-id.bin"   # the digital I/O board's DS2401
preload = ["29f016a.27m:gcb16jaa.27m", "29f016a.31m:gcb16jaa.31m"]   # chips the set has filled: device:file (MAME's regions)
msu_flash = "flash.20t"         # the multi-session unit's TX3927 firmware (29F400)
msu_rtc = "m48t58y.6t"          # ... and its M48T58Y

[board]
io_board = "digital"            # GX894-PWB(B): FPGA + MAS3507D MP3
cassette = "zi"                 # MAME's cassette variant: ZS01 + DS2401 (casszi)
msu = true                      # the multi-session unit (GXA25)

[cd]
chd = "b16jaa02"        # the runtime CD
msu_chd = "b16jba02"    # the multi-session unit's CD
