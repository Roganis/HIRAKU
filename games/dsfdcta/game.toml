# Dancing Stage featuring Dreams Come True (GC910 VER. JAA), Konami 1999: generated from MAME's ksys573.cpp (tools/gen573.py)
id = "dsfdcta"
title = "Dancing Stage featuring DREAMS COME TRUE (JAA)"
family = "ddr"          # DDR cabinet: 4 panels per player, menu buttons
mame = "dsfdcta"        # MAME set name, used by the oracle
core = "sys573"         # System 573 (runtime/sys573/, PLAN.md section 19); analog I/O board
boot_seconds = 85       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)
install_cassette = "yes"   # the launcher's first boot uses the install cassette (--cassette install)

[roms]
bios = "700a01.22g"             # 573 BIOS
h8 = "h8a01.bin"                # the H8's start-up response (JVS check)
cassette_eeprom = "gc910ja.u1"  # the game cassette's X76F100
cassette_id = "gc910ja.u6"      # ... and its DS2401 serial number
install_eeprom = "gn884ja.u1"   # the install cassette's X76F100 (first boot: --cassette install)
install_id = "gn884ja.u6"       # ... and its DS2401

[board]
io_board = "analog"             # GX700-PWB(F): lamp and stage outputs; the music is CD audio
cassette = "yi"                 # MAME's cassette variant: X76F100 + DS2401 (cassyi)
pccard2 = "32mb"                # MAME's pccard2_32mb(): a Fujitsu 32 MiB flash card in slot 2

[cd]
chd = "910jaa02"        # the runtime CD
