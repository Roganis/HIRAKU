# Guitar Freaks 10th Mix (G*D10 VER. JAA), Konami 2003: generated from MAME's ksys573.cpp (tools/gen573.py)
id = "gtfrk10ma"
title = "Guitar Freaks 10th Mix"
family = "gtrf"         # GuitarFreaks cabinet: two guitars (neck R/G/B, pick, wailing, effect knob)
mame = "gtfrk10ma"      # MAME set name, used by the oracle
core = "sys573"         # System 573 (runtime/sys573/, PLAN.md section 19); digital I/O board
boot_seconds = 151      # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[roms]
bios = "700a01.22g"             # 573 BIOS
h8 = "h8a01.bin"                # the H8's start-up response (JVS check)
cassette_eeprom = "gcd10jaa.u1" # the game cassette's ZS01
cassette_id = "gcd10jaa.u6"     # ... and its DS2401 serial number
digital_id = "digital-id.bin"   # the digital I/O board's DS2401

[board]
io_board = "digital"            # GX894-PWB(B): FPGA + MAS3507D MP3
cassette = "zi"                 # MAME's cassette variant: ZS01 + DS2401 (casszi)
pccard1 = "32mb"                # MAME's pccard1_32mb(): a Fujitsu 32 MiB flash card in slot 1

[cd]
chd = "d10jaa02"        # the runtime CD
install_chd = "d10jba02"# MAME's install disc: the first boot's CD (--cd install)
