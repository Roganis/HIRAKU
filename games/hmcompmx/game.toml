# hiphopmania complete MIX (ver UA-B), Konami 1999: generated from MAME's djmain.cpp
id = "hmcompmx"
title = "hiphopmania complete MIX (UA-B)"
family = "djbm"         # DJ Main beatmania cabinet: 5 keys + turntable per player, effect
mame = "hmcompmx"       # MAME set name, used by the oracle
core = "djmain"         # interpreted 68EC020 on the DJ Main board (runtime/djmain/)
boot_seconds = 77       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)
map = "u"               # MAME djmainu: main_map_u (the IDE ports and tile RAM elsewhere)

[roms]
program = ["858uab01.6a", "858uab02.8a"]
sprites = ["858uaa03.19a", "858uaa04.20a", "858uaa05.22a", "858uaa06.24a"]
tiles   = ["858uaa07.22d", "858uaa08.23d", "858uaa09.25d", "858uaa10.27d"]

[hdd]
chd = "858jaa11"
chs = "4200,16,63"       # its geometry (cylinders, heads, sectors), as the CHD gives it to MAME's drive
# ATA security, from MAME init_hmcompmx(): the disk stays locked until the game sends these
