# beatmania IIDX 10th style (D01 J:A:x), Konami 2004: a Windows PC, the C02 cabinet
id = "iidx10"
title = "beatmania IIDX 10th style"
family = "iidx"         # IIDX cabinet: 7 keys and a turntable per player, VEFX, Effect, 5 effector sliders
core = "pc"             # Konami's own program in HIRAKU's cabinet (runtime/pc/, PLAN.md section 36)

[pc]
exe = "bm2dx.exe"       # in D01/JAx/, a folder by revision: the last (JAE) is run
mark = "D01.grade"      # what tells this game's program from 9th style's and RED's (all bm2dx.exe)
layout = "revisions"
board = "c02-driver"    # the C02 cabinet's board under its driver (runtime/pc/ezusb_dev.c), under Konami's
                        # own ezusb.dll, from RtEffect.dll
security = "GQD01JAA 0:1:1"   # the security plug: the game's model code and the boot's seeds
sidcode = "D01:J:A"     # the cabinet's software id (..\sidcode.txt), the revision's letter added
drive = 'D:\D01'        # where the game is: its program in JAx, its data beside it
data_as = '..\data'     # the game names its data from the program's folder
save_drive = 'E:\'      # its two backup drives (bkeep.dat, settings, the AVS NVRAM)
save_drive2 = 'F:\'
