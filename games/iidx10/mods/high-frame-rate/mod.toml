name = "High frame rate (120 Hz)"
version = "0.1"
game = "iidx10"
description = "While a song plays (and the attract demo), the game runs at twice its rate (120 Hz on a 120 or 240 Hz display): its notes and bar lines move twice as often, its presses are read twice as often, and it judges as on the cabinet. The charts are read in half frames; the judging takes them back to the cabinet's frames, so every window is as long as before. The animations, the effects and the timers keep the cabinet's pace. For the program JAE."

# As GOLD's (games/iidx14/mods/high-frame-rate, the same design): the chart files' times read doubled
# (chart_times), the notes' step a frame halved, what the chart code counts in frames doubled, the
# rest held to the cabinet's pace.

[[rate]]
hz = "x2"                      # exactly twice the cabinet's rate
while_changing = 0x0192d9a0    # the chart's position (frames from its start): while a chart plays
chart_times = 2                # the chart files' times read doubled: the charts in half frames

# --- the notes' step a frame, halved

[[patch]]
# the scroll ring's speed, set by a BPM change in one of five ways (the HI-SPEED's), all ending where
# the ring moves on: a call there to the few instructions below (in the padding after a routine)
address = 0x00419aeb
original = "8b7d0083c504"
replace = "e872f5ffff90"

[[patch]]
# sar dword [edi], 1 (the speed just set, halved); mov edi, [ebp]; add ebp, 4; ret
address = 0x00419062
original = "909090909090909090"
replace = "d13f8b7d0083c504c3"

# --- what the chart code counts in frames, doubled

[[patch]]
# a lane's nearest note looked for up to 60 frames late -> 121
address = 0x0041b456
original = "83fe3c"
replace = "83fe79"

[[patch]]
# a note let go 60 frames after its time -> 121
address = 0x0041b333
original = "83c23c"
replace = "83c279"

[[patch]]
# a note drawn up to 4 frames after its time -> 9
address = 0x0041b66e
original = "83c004"
replace = "83c009"

[[patch]]
# a note missed when the BAD window's late edge (0x01944ed8, in the cabinet's frames) has passed:
# in half frames, the note's time + the edge x 2 + 1. Its load made a call to the few instructions
# below
address = 0x0041b55c
original = "8b15d84e9401"
replace = "e824feffff90"

[[patch]]
# mov edx, [0x01944ed8]; lea edx, [edx + edx + 1]; ret
address = 0x0041b385
original = "9090909090909090909090"
replace = "8b15d84e94018d541201c3"

[[patch]]
# the turntable sampled every other frame (a toggle 1, 0) -> every fourth half frame (3 to 0)
address = 0x0041ae5d
original = "2401"
replace = "2403"

[[patch]]
# a turntable turned back within 4 frames is the same scratch -> 8
address = 0x0041b0e1
original = "83ff04"
replace = "83ff08"

[[patch]]
# a failed stage: its routine counts frames of the chart's position from the failure (16, 20, 122;
# 150, 300, 359, 600 when the game goes on), so its two reads of the position are made reads of it
# halved, in the cabinet's frames
address = 0x00421bbf
original = "e8bc8effff"
replace = "e8d3f4ffff"

[[patch]]
# ... the other
address = 0x00421bfa
original = "e8818effff"
replace = "e898f4ffff"

[[patch]]
# call (the position); sar eax, 1; ret
address = 0x00421097
original = "9090909090909090"
replace = "e8e499ffffd1f8c3"

[[patch]]
# the gauge's graph (the result screen's) sampled every 32 frames of the chart's position, 384 at
# most -> every 64 half frames
address = 0x004203d4
original = "1f"
replace = "3f"

