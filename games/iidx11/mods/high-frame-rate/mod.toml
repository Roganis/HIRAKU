name = "High frame rate (120 Hz)"
version = "0.1"
game = "iidx11"
description = "While a song plays (and the attract demo), the game runs at twice its rate (120 Hz on a 120 or 240 Hz display): its notes and bar lines move twice as often, its presses are read twice as often, and it judges as on the cabinet. The charts are read in half frames; the judging takes them back to the cabinet's frames, so every window is as long as before. The animations, the effects and the timers keep the cabinet's pace. For the program JAD."

# As GOLD's (games/iidx14/mods/high-frame-rate, the same design): the chart files' times read doubled
# (chart_times), the notes' step a frame halved, what the chart code counts in frames doubled, the
# rest held to the cabinet's pace.

[[rate]]
hz = "x2"                      # exactly twice the cabinet's rate
while_changing = 0x0155a960    # the chart's position (frames from its start): while a chart plays
chart_times = 2                # the chart files' times read doubled: the charts in half frames

# --- the notes' step a frame, halved

[[patch]]
# the scroll ring's speed, set by a BPM change in one of five ways (the HI-SPEED's), all ending where
# the ring moves on: a call there to the few instructions below (in the padding after a routine)
address = 0x0041d7a1
original = "8b7d0083c504"
replace = "e8edf8ffff90"

[[patch]]
# sar dword [edi], 1 (the speed just set, halved); mov edi, [ebp]; add ebp, 4; ret
address = 0x0041d093
original = "909090909090909090"
replace = "d13f8b7d0083c504c3"

# --- what the chart code counts in frames, doubled

[[patch]]
# a lane's nearest note looked for up to 60 frames late -> 121
address = 0x0041f106
original = "83fe3c"
replace = "83fe79"

[[patch]]
# a note let go 60 frames after its time -> 121
address = 0x0041eff3
original = "83c23c"
replace = "83c279"

[[patch]]
# a note drawn up to 4 frames after its time -> 9
address = 0x0041f31f
original = "83c104"
replace = "83c109"

[[patch]]
# a note missed when the BAD window's late edge (0x0157aed0, in the cabinet's frames) has passed:
# in half frames, the note's time + the edge x 2 + 1. Its load made a call to the few instructions
# below
address = 0x0041f20c
original = "8b15d0ae5701"
replace = "e8d2feffff90"

[[patch]]
# mov edx, [0x0157aed0]; lea edx, [edx + edx + 1]; ret
address = 0x0041f0e3
original = "9090909090909090909090"
replace = "8b15d0ae57018d541201c3"

[[patch]]
# the turntable sampled every other frame (a toggle 1, 0) -> every fourth half frame (3 to 0)
address = 0x0041eb1d
original = "2401"
replace = "2403"

[[patch]]
# a turntable turned back within 4 frames is the same scratch -> 8
address = 0x0041eda1
original = "83ff04"
replace = "83ff08"

[[patch]]
