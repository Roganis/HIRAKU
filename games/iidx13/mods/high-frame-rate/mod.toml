name = "High frame rate (120 Hz)"
version = "0.1"
game = "iidx13"
description = "While a song plays (and the attract demo), the game runs at twice its rate (120 Hz on a 120 or 240 Hz display): its notes and bar lines move twice as often, its presses are read twice as often, and it judges as on the cabinet. The charts are read in half frames; the judging takes them back to the cabinet's frames, so every window is as long as before. The animations, the effects and the timers keep the cabinet's pace. For the program JAG."

# As GOLD's (games/iidx14/mods/high-frame-rate, the same design): the chart files' times read doubled
# (chart_times), the notes' step a frame halved, what the chart code counts in frames doubled, the
# rest held to the cabinet's pace.

[[rate]]
hz = "x2"                      # exactly twice the cabinet's rate
while_changing = 0x01ff09cc    # the chart's position (frames from its start): while a chart plays
chart_times = 2                # the chart files' times read doubled: the charts in half frames

# --- the notes' step a frame, halved (the scroll ring's speed: the BPM times 4816, or a fixed one)

[[patch]]
# a fixed speed (481,600 a frame) -> 240,800
address = 0x0046d54a
original = "40590700"
replace = "a0ac0300"

[[patch]]
# the BPM times 4816 -> 2408
address = 0x0046d554
original = "d0120000"
replace = "68090000"

# --- what the chart code counts in frames, doubled

[[patch]]
# a lane's nearest note looked for up to 60 frames late -> 121
address = 0x0046dc92
original = "83fa3c"
replace = "83fa79"

[[patch]]
# a note let go 60 frames after its time -> 121
address = 0x0046ee2f
original = "83c03c"
replace = "83c079"

[[patch]]
# a note drawn up to 4 frames after its time -> 9
address = 0x0046eadc
original = "83c104"
replace = "83c109"

[[patch]]
# a note missed when the BAD window's late edge (0x01fe3a20, in the cabinet's frames) has passed:
# in half frames, the note's time + the edge x 2 + 1. Its load made a call to the few instructions
# below (in the padding after a routine)
address = 0x0046e97c
original = "8b0d203afe01"
replace = "e8ef05000090"

[[patch]]
# mov ecx, [0x01fe3a20]; lea ecx, [ecx + ecx + 1]; ret
address = 0x0046ef70
original = "cccccccccccccccccccccc"
replace = "8b0d203afe018d4c0901c3"

