name = "High frame rate (120 Hz)"
version = "0.1"
game = "iidx14"
description = "While a song plays (and the attract demo), the game runs at twice its rate (120 Hz on a 120 or 240 Hz display): its notes and bar lines move twice as often, its presses are read twice as often, and it judges as on the cabinet. The charts are read in half frames; the judging takes them back to the cabinet's frames, so every window is as long as before. The animations, the effects and the timers keep the cabinet's pace. For the program of 2007072301."

# GOLD counts everything in frames, its charts too: each event's time in the chart files is a frame
# number. HIRAKU's DLL reads every chart file with its times doubled (chart_times), so the charts are
# in half frames and the game, at twice its rate, plays them at the same speed; the notes' step a
# frame (from the BPM) is halved, so they move as far a second; what the chart code counts in frames
# is doubled; the rest is held to the cabinet's pace (between_ticks). The judging takes each lane's
# distance back to whole cabinet frames (HIRAKU's DLL, as for EMPRESS).

[[rate]]
hz = "x2"                      # exactly twice the cabinet's rate
while_changing = 0x0290009c    # the chart's position (frames from its start): while a chart plays
chart_times = 2                # the chart files' times read doubled: the charts in half frames

