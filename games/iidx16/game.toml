# beatmania IIDX 16 EMPRESS (I00 J:A:A), Konami 2008: a Windows PC, the C02 cabinet
id = "iidx16"
title = "beatmania IIDX 16 EMPRESS"
family = "iidx"         # IIDX cabinet: 7 keys and a turntable per player, VEFX, Effect, 5 effector sliders
core = "pc"             # Konami's own program in HIRAKU's cabinet (runtime/pc/, PLAN.md section 36)

[pc]
exe = "bm2dx.exe"       # in I00/<date>/, a folder by revision: the last (2009072200) is run
mark = "I00.game.s"     # what tells this game's program from the other IIDX's (all bm2dx.exe)
layout = "revisions"
board = "c02-driver"    # the cabinet's board under its driver (runtime/pc/ezusb_dev.c), from libacio.dll
io = "fx2"              # ... the later one (IO2, an FX2): as DJ TROOPERS
security = "GQI00JAA"     # the security plug: the game's model code (the later plugs: no seeds)
sidcode = "I00:*:A:A"   # the cabinet's software id (..\sidcode.txt), the revision's date added
drive = 'D:\I00'        # where the game is: its program in <date>, its data beside it
data_as = '..\data'     # the game names its data from the program's folder
save_drive = 'E:\'      # its two backup drives (bkeep.dat, settings, the AVS NVRAM)
save_drive2 = 'F:\'
