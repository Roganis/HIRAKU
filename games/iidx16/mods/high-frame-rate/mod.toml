name = "High frame rate (120 Hz)"
version = "0.1"
game = "iidx16"
description = "While a chart plays (a song, the attract demo), the game runs at twice its rate (120 Hz on a 120 or 240 Hz display): its notes and bar lines move twice as often, its presses are read twice as often, and it judges as on the cabinet. The charts are counted in half frames; the judging takes them back to the cabinet's frames, so every window is as long as before. The animations, the effects and the timers keep the cabinet's pace. For the program of 2009072200. A song longer than 4 minutes 32 seconds can't be counted in half frames: don't play one with it."

# The game counts everything in frames, the song's position too, and converts its charts (in
# milliseconds) to frames as a song loads (0x489300, with the frame of the operator's DISPLAY TYPE:
# 16.6528 ms for A, 16.6806 for B). Halved, the charts are in half frames and the game, at twice its
# rate, plays them at the same speed; the scroll's speed is figured from the same frame, so the
# notes move as far a second. HIRAKU's DLL sees the halved frame (runtime/pc/cabinet.c, chart_frame)
# and judges each press with the lanes' distances taken back to whole frames (runtime/pc/press.c).
# Docs: docs/MODS.md ("beatmania IIDX EMPRESS"), docs/SMOOTH.md.

[[rate]]
hz = "x2"                      # exactly twice the cabinet's rate (59.935 or 60.035 Hz, as the display type)
while_changing = 0x029393b0    # the chart's position (frames from its start): while a chart plays

# --- the charts in half frames, and what the chart code counts with them

