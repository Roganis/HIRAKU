# pop'n music 13 Carnival (G-E13 JAE), Konami 2005: Konami Python 1
# Boot record C is a loader (~300 KB): it loads ee/boot/game.bin from a file system on the disk.
id = "popn13"
title = "pop'n music 13 Carnival"
family = "pypopn"       # pop'n on Konami Python: 9 buttons, the interface board's lamps
core = "python"         # PCSX2 Reliquary hosted by HIRAKU (runtime/python/, PLAN.md section 23); not in MAME
boot_seconds = 29       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[python]
io_mode = "POPN"        # the interface board's input profile (Reliquary's IoMode)
# SHA-1 of the EE program: boot record C on the disk, Konami-LZ-decoded (tools/pythonfs.py)
ee_sha1 = "26f53420b51722af90c6281b88af19d467a1376f"
hdd = "e13_a04"
