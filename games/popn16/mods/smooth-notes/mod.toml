name = "Smooth notes (high frame rate)"
version = "0.1"
game = "popn16"
description = "While a song plays, the game draws at the display's refresh rate (120, 144, 240 Hz...): its notes come from its song clock, so they move at the display's rate, and it judges as before. The animated objects (characters, hit effects), its frame counters and the demo's length keep the cabinet's pace. For the program of 2008052700 (the newest)."

[[rate]]
hz = "display"                 # the display's refresh rate (no window: 119.88); or a number, up to 1000
while_changing = 0x00d27f78    # the song clock (ms: timeGetTime from the song's start)
while_equal = 0x00d12c4c       # ... and while the play screen's phase is 4: the song itself
value = 4

# Between the cabinet's ticks these count by 0 (each `+1` made `+0`), so they keep its pace: every
# animated object's frame (each `add dword [reg(+x)], 1` right after the call of the sprites' draw
# routine), the play screen's counters, the demo's length

[[patch]]
# an animated object's frame, stepped after the sprites' draw routine draws it
address = 0x00464b8c
original = "830601"
replace = "830600"
between_ticks = true

