original = "83c001"
replace = "83c000"
between_ticks = true

[[patch]]
# a timer counted up to a limit (add dword [eax], 1; the limit at [eax - 0x188])
address = 0x0046d451
original = "830001"
replace = "830000"
between_ticks = true

[[patch]]
# a set of counters stepped by one in a loop (add [ebp+esi*4+x], reg: the reg also steps the
# loop, so the add itself goes: nop dword [eax+0])
address = 0x0046cbff
original = "01bcb504090000"
replace = "0f1f8000000000"
between_ticks = true

[[patch]]
# a 4-second timer (counted to 240 frames: add [ebp+x], reg, the reg 1; the add goes: nop word [eax+eax+0])
address = 0x0046cd31
original = "01bd80090000"
replace = "660f1f440000"
between_ticks = true
