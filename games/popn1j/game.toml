# pop'n music (GQ803 JA-A), Konami 1998
id = "popn1j"
title = "pop'n music"
family = "djpopn"       # DJ Main pop'n music cabinet: 9 buttons
mame = "popn1j"         # MAME set name, used by the oracle
core = "djmain"         # interpreted 68EC020 on the DJ Main board (runtime/djmain/)
boot_seconds = 77       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[roms]
program = ["803jaa01.6a", "803jaa02.8a"]
sprites = ["803jaa03.19a", "803jaa04.20a", "803jaa05.22a", "803jaa06.24a"]
tiles   = ["803jaa07.22d", "803jaa08.23d", "803jaa09.25d", "803jaa10.27d"]

[hdd]
chd = "803jaa11"
chs = "4965,16,63"       # its geometry (cylinders, heads, sectors), as the CHD gives it to MAME's drive
