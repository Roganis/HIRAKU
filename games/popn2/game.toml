# pop'n music 2 (ver JA-A), Konami 1999: generated from MAME's djmain.cpp
id = "popn2"
title = "pop'n music 2"
family = "djpopn"       # DJ Main pop'n music cabinet: 9 buttons
mame = "popn2"          # MAME set name, used by the oracle
core = "djmain"         # interpreted 68EC020 on the DJ Main board (runtime/djmain/)
boot_seconds = 77       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[roms]
program = ["831jaa01.8a", "831jaa02.6a"]
sprites = ["831jaa03.19a", "831jaa04.20a", "831jaa05.22a", "831jaa06.24a"]
tiles   = ["831jaa07.22d", "831jaa08.23d", "831jaa09.25d", "831jaa10.27d"]

[hdd]
chd = "831jhdda01"
chs = "524,255,63"       # its geometry (cylinders, heads, sectors), as the CHD gives it to MAME's drive
