# pop'n music 4 (GQ986 JAA), Konami 2000
id = "popn4"
title = "pop'n music 4"
family = "popn"
mame = "popn4"
boot_seconds = 73       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[program]
exe = "FIREBEAT.EXE"
sha1 = "f8abfcdc9ebcf7cbcab2a6c12077bd48c95ebc7f"   # unpacked image, not the packed exe
size = 0x100000
load = 0x80000000
entry = 0x80003000

[board]
dongle = "gq986_gc986"     # DS1991 image inside the MAME ROM set

[spu]
rom = "a02jaa04.3q"     # 68000 program, from the MAME set (same for pop'n 4-8)
