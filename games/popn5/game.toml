# pop'n music 5 (GCA04 JAA), Konami 2000
id = "popn5"
title = "pop'n music 5"
family = "popn"
mame = "popn5"
boot_seconds = 60       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[program]
exe = "FIREBEAT.EXE"
sha1 = "84ffb6eb4def4a68e59980125f0e13f4aff6cecd"   # unpacked image, not the packed exe
size = 0x100000
load = 0x80000000
entry = 0x80003000

[board]
dongle = "gea04-ja_gca04-ja_gca04-jb.bin"     # DS1991 image inside the MAME ROM set

[spu]
rom = "a02jaa04.3q"     # 68000 program, from the MAME set (same for pop'n 4-8)
