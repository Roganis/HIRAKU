# pop'n music 6 (GQA16 JAC), Konami 2001
id = "popn6"
title = "pop'n music 6"
family = "popn"
mame = "popn6"
boot_seconds = 50       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)
first_boot = "the game installs its SPU data to flash, about 14 minutes of game time. Hold Tab to fast-forward."   # shown by the launcher

[program]
exe = "FIREBEAT.EXE"
sha1 = "831d1fcd55b5e1acd1e9400162befb120fc3fceb"   # unpacked image, not the packed exe
size = 0x100000
load = 0x80000000
entry = 0x80002018

[board]
dongle = "gqa16-ja"     # DS1991 image inside the MAME ROM set

[spu]
rom = "a02jaa04.3q"     # 68000 program, from the MAME set (same for pop'n 4-8)
