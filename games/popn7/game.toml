# pop'n music 7 (GCB00 JAB), Konami 2001
id = "popn7"
title = "pop'n music 7"
family = "popn"
mame = "popn7"
boot_seconds = 62       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[program]
exe = "FIREBEAT.EXE"
sha1 = "1e63f2d5b2939ccf4efcf1ed701ff3a9170a1259"   # unpacked image, not the packed exe
size = 0x100000
load = 0x80000000
entry = 0x80002018

[board]
dongle = "gcb00"     # DS1991 image inside the MAME ROM set

[spu]
rom = "a02jaa04.3q"     # 68000 program, from the MAME set (same for pop'n 4-8)
