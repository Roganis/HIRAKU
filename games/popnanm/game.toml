# pop'n music Animelo (GQ987 JAA), Konami 2000
id = "popnanm"
title = "pop'n music Animelo"
family = "popn"
mame = "popnanm"
boot_seconds = 58       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[program]
exe = "FIREBEAT.EXE"
sha1 = "3b4c4e6c1878f7c100bbd10427192c984c025ed0"   # unpacked image, not the packed exe
size = 0x100000
load = 0x80000000
entry = 0x80003000

[board]
dongle = "gq987_gc987_forever"   # DS1991 image inside the MAME ROM set

[spu]
rom = "a02jaa04.3q"     # 68000 program, from the MAME set
