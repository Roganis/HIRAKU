# pop'n music Animelo 2 (GEA02 JAC), Konami 2001
id = "popnanm2"
title = "pop'n music Animelo 2"
family = "popn"
mame = "popnanm2"
boot_seconds = 48       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[program]
exe = "FIREBEAT.EXE"
sha1 = "4cb071e730bd9a3d5940f67d4246f7e1a7654763"   # unpacked image, not the packed exe
size = 0x100000
load = 0x80000000
entry = 0x80003000

[board]
dongle = "gca02ja_gca02jb_gea02ja_forever"   # DS1991 image inside the MAME ROM set

[spu]
rom = "a02jaa04.3q"     # 68000 program, from the MAME set

[recomp]
# Functions Ghidra cannot find (from the runtime's interpreter-fallback log)
extra_entries = [0x8003ee20, 0x8003e60c]
