# pop'n stage EX (ver JB-A), Konami 1999: generated from MAME's djmain.cpp
id = "popnstex"
title = "pop'n stage EX"
family = "djpstage"     # DJ Main pop'n stage cabinet: 10 buttons, 3 selection buttons
mame = "popnstex"       # MAME set name, used by the oracle
core = "djmain"         # interpreted 68EC020 on the DJ Main board (runtime/djmain/)
boot_seconds = 77       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)

[roms]
program = ["970jba01.6a", "970jba02.8a"]
sprites = ["970jba03.19a", "970jba04.20a", "970jba05.22a", "970jba06.24a"]
tiles   = ["970jba07.22d", "970jba08.23d", "970jba09.25d", "970jba10.27d"]

[hdd]
chd = "970jba11"
chs = "12316,16,32"       # its geometry (cylinders, heads, sectors), as the CHD gives it to MAME's drive
