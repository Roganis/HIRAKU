# ParaParaParadise v1.1 (GQ977 JAA), Konami 2000
id = "ppp11"
title = "ParaParaParadise v1.1"
family = "ppp"
mame = "ppp11"
boot_seconds = 38       # fast start-up's ready point: the machine's seconds to the end of its start-up (host/warp.h)
first_boot = "the backup RAM (E160) and sound flash (E124) are blank. Press F2 for test mode, run SOUND FLASH INIT, then ALL FACTORY SETTINGS."   # shown by the launcher

[program]
exe = "HIKARU.EXE"      # wrapped by the ParaPara "!:EXE:00" loader
sha1 = "aeb5087627e5fcd66fdd1c5126b294b25c1419d7"   # unpacked image, not the packed exe
size = 0x100000
load = 0x80000000
entry = 0x80002018

[board]
dongle = "gq977"        # DS1991 image inside the MAME ROM set

[recomp]
# Functions Ghidra cannot find (from the runtime's interpreter-fallback log)
extra_entries = [0x80041260, 0x80040b34]
